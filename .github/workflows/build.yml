name: Build programs

# Run by hand from the Actions tab, or push a tag like v1.0.0 to also publish a Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows, exe: FusionDrawingGenerator.exe }
          - { os: ubuntu-latest,  target: linux,   exe: FusionDrawingGenerator }
          - { os: macos-latest,   target: mac,     exe: FusionDrawingGenerator }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux system libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Install dependencies
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip pyinstaller
          python setup.py --no-shortcut
      - name: Build the single file
        shell: bash
        run: |
          SEP=":"; [ "${{ matrix.target }}" = "windows" ] && SEP=";"
          ICON=""; [ "${{ matrix.target }}" = "windows" ] && ICON="--icon assets/icon.ico"
          WIN="--windowed"; [ "${{ matrix.target }}" = "mac" ] && WIN=""
          HERE="$GITHUB_WORKSPACE"
          python -m PyInstaller --noconfirm --clean --onefile $WIN \
            --name FusionDrawingGenerator --distpath "$HERE/out" --workpath "$RUNNER_TEMP/work" --specpath "$RUNNER_TEMP/work" \
            --paths "$HERE/src" --add-data "$HERE/assets${SEP}assets" --add-data "$HERE/scripts${SEP}scripts" \
            --collect-all cadquery --collect-all OCP --collect-all vtkmodules \
            --collect-submodules scipy.spatial --collect-submodules reportlab \
            --hidden-import PyQt5.QtSvg \
            --exclude-module matplotlib --exclude-module tkinter --exclude-module IPython \
            --exclude-module pytest --exclude-module fitz $ICON "$HERE/main.py"
      - name: Put the Fusion script next to the program
        shell: bash
        run: cp -r scripts out/scripts
      - name: Zip
        shell: bash
        run: |
          cd out
          if [ "${{ matrix.target }}" = "windows" ]; then 7z a ../FusionDrawingGenerator-${{ matrix.target }}.zip . ; else zip -r ../FusionDrawingGenerator-${{ matrix.target }}.zip . ; fi
      - uses: actions/upload-artifact@v4
        with:
          name: FusionDrawingGenerator-${{ matrix.target }}
          path: FusionDrawingGenerator-${{ matrix.target }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
